name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      # SDK 57 requires Node 22.13 or newer.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # EXPO_PUBLIC_ values are inlined by Metro at bundle time, so they have to
      # exist before prebuild. Without them the app throws on first render.
      - name: Write environment
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}"
            echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}"
          } > .env

      - name: Verify environment is present
        run: |
          for key in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_API_URL; do
            grep -q "^${key}=." .env || { echo "::error::${key} is empty. Set it in repository secrets."; exit 1; }
          done

      # Prebuild first: it regenerates expo-env.d.ts, which is gitignored and
      # carries the reference to expo/types that declares CSS imports.
      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Report APK size
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          size=$(stat -c%s "$apk")
          echo "APK $(( size / 1024 / 1024 )) MB ($size bytes)"
          echo "### APK $(( size / 1024 / 1024 )) MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legalx-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
